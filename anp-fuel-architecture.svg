<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7CD6"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">anp-fuel</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#6b7280">Pipeline de dados ELT · Série Histórica de Preços de Combustíveis (ANP)</text>

  <!-- ================= ROW 1: SOURCE ================= -->
  <g>
    <rect x="40" y="100" width="150" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="115" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">ANP</text>
    <text x="115" y="148" text-anchor="middle" font-size="11" fill="#6b7280">gov.br (dados abertos)</text>
  </g>

  <line x1="190" y1="135" x2="235" y2="135" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="212" y="122" text-anchor="middle" font-size="10" fill="#6b7280">extract.py</text>

  <!-- BRONZE -->
  <g>
    <rect x="238" y="100" width="150" height="70" rx="10" fill="#f6e6d8" stroke="#c17a3c" stroke-width="1.5"/>
    <circle cx="258" cy="118" r="6" fill="#c17a3c"/>
    <text x="313" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4f1e">BRONZE</text>
    <text x="313" y="146" text-anchor="middle" font-size="10.5" fill="#8a4f1e">precos_raw.parquet</text>
    <text x="313" y="160" text-anchor="middle" font-size="9.5" fill="#a97a4a">dado cru, fiel à fonte</text>
  </g>

  <line x1="388" y1="135" x2="433" y2="135" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="122" text-anchor="middle" font-size="10" fill="#6b7280">transform.py</text>

  <!-- SILVER PARQUET -->
  <g>
    <rect x="436" y="100" width="150" height="70" rx="10" fill="#eceff1" stroke="#8a96a3" stroke-width="1.5"/>
    <circle cx="456" cy="118" r="6" fill="#8a96a3"/>
    <text x="511" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">SILVER</text>
    <text x="511" y="146" text-anchor="middle" font-size="10.5" fill="#4b5563">precos_tratado.parquet</text>
    <text x="511" y="160" text-anchor="middle" font-size="9.5" fill="#6b7280">limpo &amp; validado</text>
  </g>

  <line x1="586" y1="135" x2="631" y2="135" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="608" y="122" text-anchor="middle" font-size="10" fill="#6b7280">load.py</text>

  <!-- SILVER POSTGRES -->
  <g>
    <rect x="634" y="100" width="180" height="70" rx="10" fill="#dbe9fb" stroke="#2E7CD6" stroke-width="1.5"/>
    <circle cx="654" cy="118" r="6" fill="#2E7CD6"/>
    <text x="724" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4c8c">SILVER · PostgreSQL</text>
    <text x="724" y="146" text-anchor="middle" font-size="10.5" fill="#1a4c8c">precos_combustiveis</text>
    <text x="724" y="160" text-anchor="middle" font-size="9.5" fill="#3a6bb0">~2,98M linhas</text>
  </g>

  <line x1="814" y1="135" x2="859" y2="135" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="836" y="115" text-anchor="middle" font-size="10" fill="#6b7280">dbt run</text>
  <text x="836" y="128" text-anchor="middle" font-size="10" fill="#6b7280">dbt test</text>

  <!-- GOLD -->
  <g>
    <rect x="862" y="92" width="290" height="86" rx="10" fill="#fdf2cf" stroke="#c9a227" stroke-width="1.5"/>
    <circle cx="882" cy="112" r="6" fill="#c9a227"/>
    <text x="1007" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5e0a">GOLD</text>
    <text x="1007" y="136" text-anchor="middle" font-size="10" fill="#7a5e0a">4 marts flat · preço mensal, ranking</text>
    <text x="1007" y="150" text-anchor="middle" font-size="10" fill="#7a5e0a">bandeiras, etanol×gasolina, variação</text>
    <text x="1007" y="166" text-anchor="middle" font-size="10" font-weight="600" fill="#7a5e0a">+ star schema (dim/fato)</text>
  </g>

  <!-- ================= ROW 2: STAR SCHEMA DETAIL ================= -->
  <g>
    <text x="600" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Star Schema (dbt · dbt_utils surrogate keys)</text>
  </g>

  <!-- fato_coleta center -->
  <rect x="510" y="248" width="180" height="60" rx="10" fill="#fdf2cf" stroke="#c9a227" stroke-width="1.5"/>
  <text x="600" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5e0a">fato_coleta</text>
  <text x="600" y="288" text-anchor="middle" font-size="9.5" fill="#7a5e0a">2,98M linhas · grão: coleta</text>

  <!-- dim_posto -->
  <rect x="240" y="248" width="150" height="60" rx="10" fill="#fff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="315" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5e0a">dim_posto</text>
  <text x="315" y="288" text-anchor="middle" font-size="9" fill="#a08830">cnpj, bandeira, uf</text>
  <line x1="390" y1="278" x2="505" y2="278" stroke="#c9a227" stroke-width="1.5"/>

  <!-- dim_produto -->
  <rect x="240" y="325" width="150" height="60" rx="10" fill="#fff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="315" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5e0a">dim_produto</text>
  <text x="315" y="365" text-anchor="middle" font-size="9" fill="#a08830">produto, unidade</text>
  <line x1="390" y1="355" x2="600" y2="355" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="600" y1="355" x2="600" y2="308" stroke="#c9a227" stroke-width="1.5"/>

  <!-- dim_tempo -->
  <rect x="810" y="248" width="150" height="60" rx="10" fill="#fff" stroke="#c9a227" stroke-width="1.3"/>
  <text x="885" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5e0a">dim_tempo</text>
  <text x="885" y="288" text-anchor="middle" font-size="9" fill="#a08830">ano, mes, trimestre</text>
  <line x1="695" y1="278" x2="805" y2="278" stroke="#c9a227" stroke-width="1.5"/>

  <!-- ================= ROW 3: DOCKER + AIRFLOW ================= -->
  <g>
    <rect x="60" y="430" width="1080" height="260" rx="14" fill="#f0f6ff" stroke="#2E7CD6" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="100" y="458" font-size="13.5" font-weight="700" fill="#1a4c8c">🐳 Docker Compose</text>
  </g>

  <!-- Postgres container -->
  <rect x="100" y="480" width="220" height="90" rx="10" fill="#dbe9fb" stroke="#2E7CD6" stroke-width="1.5"/>
  <text x="210" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4c8c">anp_fuel_db</text>
  <text x="210" y="526" text-anchor="middle" font-size="10" fill="#1a4c8c">PostgreSQL 16</text>
  <text x="210" y="542" text-anchor="middle" font-size="9.5" fill="#3a6bb0">porta 5433 · volume pgdata</text>
  <text x="210" y="558" text-anchor="middle" font-size="9.5" fill="#3a6bb0">Silver + Gold + Star Schema</text>

  <!-- Airflow container -->
  <rect x="400" y="480" width="680" height="180" rx="10" fill="#ffffff" stroke="#2E7CD6" stroke-width="1.5"/>
  <text x="740" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4c8c">anp_fuel_airflow · DAG anp_fuel_pipeline</text>

  <!-- DAG tasks -->
  <rect x="430" y="530" width="180" height="56" rx="8" fill="#eaf2ff" stroke="#2E7CD6" stroke-width="1.3"/>
  <text x="520" y="552" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a4c8c">load_silver</text>
  <text x="520" y="568" text-anchor="middle" font-size="9" fill="#3a6bb0">BashOperator · load.py</text>

  <line x1="610" y1="558" x2="650" y2="558" stroke="#2E7CD6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="653" y="530" width="150" height="56" rx="8" fill="#eaf2ff" stroke="#2E7CD6" stroke-width="1.3"/>
  <text x="728" y="552" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a4c8c">dbt_run</text>
  <text x="728" y="568" text-anchor="middle" font-size="9" fill="#3a6bb0">9 modelos</text>

  <line x1="803" y1="558" x2="843" y2="558" stroke="#2E7CD6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="846" y="530" width="150" height="56" rx="8" fill="#eaf2ff" stroke="#2E7CD6" stroke-width="1.3"/>
  <text x="921" y="552" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a4c8c">dbt_test</text>
  <text x="921" y="568" text-anchor="middle" font-size="9" fill="#3a6bb0">18/18 ✔</text>

  <text x="740" y="610" text-anchor="middle" font-size="10" fill="#3a6bb0">Scheduler + Webserver (localhost:8080) · disparo manual ou agendado</text>

  <line x1="320" y1="525" x2="400" y2="525" stroke="#2E7CD6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="516" text-anchor="middle" font-size="9" fill="#5b8fd6">rede interna</text>

  <!-- Connector from Gold row down to Docker box -->
  <line x1="600" y1="308" x2="600" y2="430" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="600" y="730" text-anchor="middle" font-size="10.5" fill="#9ca3af">Python 3.14 (uv) · pandas/pyarrow · PostgreSQL 16 · psycopg 3 · dbt-postgres · Docker Compose · Apache Airflow 3.0.1</text>
</svg>
